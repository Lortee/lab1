[project]
name = "password-manager"
version = "1.0.0"
description = "Console password manager with encrypted JSON storage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=45.0.0"]

[project.scripts]
password-manager = "password_manager.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.11.0", "mypy>=1.15.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE"]

[tool.mypy]
strict = true
mypy_path = "src"
